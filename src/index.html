<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PragmaFintech - Sistema de gestión de clientes con operaciones CRUD en bases de datos SQL y NoSQL" />
  <meta name="theme-color" content="#1976d2" />
  <title>PragmaFintech - Gestión de Clientes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f5f5f5;
    }
    
    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 1rem;
    }
    
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e0e0e0;
      border-top-color: #1976d2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    
    .loading-text {
      color: #666;
      font-size: 1rem;
    }
    
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    
    .error-title {
      color: #d32f2f;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    
    .error-message {
      color: #666;
      max-width: 500px;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <p class="loading-text">Cargando PragmaFintech...</p>
    </div>
  </div>
  <noscript>
    <div class="error-container">
      <h1 class="error-title">JavaScript requerido</h1>
      <p class="error-message">
        Esta aplicación requiere JavaScript para funcionar. 
        Por favor, habilita JavaScript en tu navegador para continuar.
      </p>
    </div>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
